<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>掲示物作成</title>
  <link rel="stylesheet" href="style.css">
  <style id="printPageStyle">@page { size: A4 portrait; margin: 0; }</style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>掲示物作成</h1>
      <p>A4掲示物を作成し、PDF出力できます。</p>
    </div>
  </header>

  <main>
    <section class="control-panel" aria-label="掲示物設定">
      <div class="global-controls">
        <label class="field compact">
          <span>A4向き</span>
          <select id="orientation">
            <option value="portrait">縦</option>
            <option value="landscape">横</option>
          </select>
        </label>
        <label class="field compact">
          <span>レイアウト</span>
          <select id="layoutMode">
            <option value="single">1面</option>
            <option value="split">2分割</option>
          </select>
        </label>
        <div class="toolbar-actions">
          <button type="button" id="addNotice" class="primary">案内を追加</button>
          <button type="button" id="importJson">JSON取込</button>
          <button type="button" id="exportJson">JSON出力</button>
          <button type="button" id="printPdf" class="primary">PDF出力</button>
          <input type="file" id="jsonFile" accept="application/json,.json" hidden>
        </div>
      </div>
      <div id="noticeEditors" class="notice-editors"></div>
    </section>

    <section class="preview-section" aria-label="A4プレビュー">
      <div class="section-heading">
        <h2>A4プレビュー</h2>
        <span id="pageCount"></span>
      </div>
      <div id="previewArea" class="preview-area"></div>
    </section>
  </main>

  <script src="assets/vendor/qr.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image list
        run: python3 scripts/generate_image_manifest.py

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -R src assets images _site/
          BUILD_VERSION="${GITHUB_SHA::12}"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" _site/index.html _site/src/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
